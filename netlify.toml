[build]
  command = "npm run predeploy"
  publish = "dist"

# Legal pages are STATIC HTML — compliance reviewers and bots must see full
# text without JavaScript or login (JSH doctrine section 5; Twilio lesson from
# MyRealtyVault). These rules must precede the SPA fallback, status 200 never 200!.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# SPA fallback — all remaining routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
